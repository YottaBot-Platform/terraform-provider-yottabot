# GoReleaser configuration for the Terraform Registry.
#
# The Registry has hard requirements that are easy to break silently: the
# binary inside each zip must be named terraform-provider-<type>_v<version>,
# the checksum file must be <project>_<version>_SHA256SUMS, and that checksum
# file must carry a detached GPG signature from a key registered with the
# Registry. A release that violates any of these uploads successfully and then
# fails to publish.
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    # Reproducibility: use the commit's timestamp rather than build time, so
    # rebuilding the same tag produces the same bytes.
    mod_timestamp: '{{ .CommitTimestamp }}'
    flags:
      - -trimpath
    # main.version defaults to "dev". A released binary reporting "dev" is a
    # packaging bug, not a cosmetic one — it reaches `terraform version`.
    ldflags:
      - '-s -w -X main.version={{.Version}}'
    goos:
      - linux
      - darwin
      - windows
      - freebsd
    goarch:
      - amd64
      - arm64
      - '386'
      - arm
    ignore:
      - goos: darwin
        goarch: '386'
      - goos: darwin
        goarch: arm
    binary: '{{ .ProjectName }}_v{{ .Version }}'

archives:
  - formats: [zip]
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'

checksum:
  extra_files:
    - glob: 'terraform-registry-manifest.json'
      name_template: '{{ .ProjectName }}_{{ .Version }}_manifest.json'
  name_template: '{{ .ProjectName }}_{{ .Version }}_SHA256SUMS'
  algorithm: sha256

# The checksum file is signed by a service, not by a key on the runner.
#
# This replaced `gpg --detach-sign`, which needed GPG_PRIVATE_KEY and
# GPG_PASSPHRASE in repository secrets. Anything able to run a step in this
# repository could read both, and a release-signing key is worth stealing. The
# release job now presents the OpenID Connect token GitHub mints for it and
# receives a short-lived credential bound to one key; no key material reaches
# the runner at any point.
#
# scripts/sign-release.sh verifies its own output before returning it - the bytes
# signed must hash to the artifact, the key must be the one granted, and gpg
# must accept the signature against the published certificate. A signature over
# the wrong bytes is indistinguishable from a good one until a consumer rejects
# it, by which time the tag is published and immutable.
# No `sboms` block, deliberately. GoReleaser puts SBOM artifacts into its
# artifact set, and everything in that set lands in SHA256SUMS. The Terraform
# Registry reads that file as the manifest of the release and requires every
# entry to be a file it ingests -- the provider archives and the manifest, and
# nothing else. Thirteen SBOM entries made it refuse v0.1.0-rc.1 outright with
# "missing files in request body".
#
# `checksum.ids` looks like the lever and is not: measured against a local
# snapshot, restricting it changed nothing. SBOMs are therefore built after
# GoReleaser and uploaded to the release directly, which keeps them published
# without letting them reach the checksums. See release.yml.

signs:
  - artifacts: checksum
    cmd: ./scripts/sign-release.sh
    args:
      - "${artifact}"
      - "${signature}"


release:
  extra_files:
    - glob: 'terraform-registry-manifest.json'
      name_template: '{{ .ProjectName }}_{{ .Version }}_manifest.json'
  # Release candidates must not become the recommended version.
  prerelease: auto

# Release notes come from the curated CHANGELOG, not from commit subjects.
changelog:
  disable: true
