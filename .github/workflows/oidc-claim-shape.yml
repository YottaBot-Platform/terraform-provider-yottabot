name: OIDC claim shape (diagnostic)

# Prints the shape of the OpenID Connect token GitHub mints for the release job,
# so a YottaBot trust policy can be written against claims that were OBSERVED
# rather than assumed.
#
# WHY THIS EXISTS AS ITS OWN WORKFLOW
#
# The release job is moving off `GPG_PRIVATE_KEY` / `GPG_PASSPHRASE` and onto
# workload federation: it will present this token to YottaBot, YottaBot will
# check it against a stored policy pinning the repository, environment, ref and
# workflow, and mint a short-lived signing token in return. Every one of those
# conditions is matched EXACTLY. A policy written against a guessed claim shape
# does not fail loudly at review time - it fails at the first real release, on a
# tag that is already published and immutable.
#
# So the shape gets captured first, from a job that signs nothing and publishes
# nothing.
#
# THE ENVIRONMENT LINE IS THE POINT, NOT BOILERPLATE
#
# GitHub omits the `environment` claim entirely for a job that does not name an
# environment. The release job runs in `release`, and the trust policy REQUIRES
# that claim - it is what keeps the protected environment's reviewer inside the
# trust boundary. A diagnostic that ran without `environment: release` would
# print a claim set the real job never presents, which is precisely the mistake
# it exists to prevent. That it costs a maintainer approval per run is the
# feature.
#
# WHY IT RUNS FROM A TAG AND NOT FROM `main`
#
# The first version of this workflow was dispatchable from any ref, and the
# `release` environment refused it: its deployment branch policy admits tags
# matching `v*` and nothing else. That refusal was correct, and it caught a real
# bug in the instrument rather than an inconvenience in the configuration.
#
# A run from `main` would have reported `ref: refs/heads/main` and a
# `workflow_ref` ending `@refs/heads/main` — neither of which the release job
# ever presents. A policy pinned from that output would have been written from a
# claim set that does not exist on the release path, which is the precise
# failure this workflow was added to prevent. It nearly happened to the
# workflow itself.
#
# So the probe runs from a tag. `oidc-probe-*` rather than `v*`, because a `v*`
# push triggers the real release workflow, and this must never be reachable from
# a path that publishes anything. The tag is disposable and can be deleted once
# the shape is captured.
#
# Delete this workflow once the policy is enabled and a release has signed
# through it. It is a measuring instrument, not part of the release path.

on:
  # The probe path. `oidc-probe-*` is deliberately outside `v*`, so pushing one
  # cannot trigger release.yml.
  push:
    tags:
      - 'oidc-probe-*'
  # Kept for a dispatch against a `v*` tag that already carries this file — the
  # only other ref the release environment admits. It cannot work from a branch;
  # see the header.
  workflow_dispatch:
    inputs:
      audience:
        description: 'OIDC audience to request (must match the YottaBot policy)'
        required: true
        default: 'yotta:release-signing'
      yotta_base:
        description: 'Estate base URL to present the token to. Leave empty to use the YOTTA_BASE repository variable.'
        required: false

# id-token is the ONLY elevated permission here. Nothing is read from the repo
# beyond the default, nothing is written anywhere, and no secret is referenced -
# there is deliberately no `secrets:` use in this file at all.
permissions:
  contents: read
  id-token: write

jobs:
  claim-shape:
    name: print the claim shape
    runs-on: ubuntu-latest
    environment: release

    steps:
      - name: Request a token and print its claim shape
        env:
          # workflow_dispatch supplies the input; a tag push does not, so fall
          # back to the audience the policy expects.
          AUDIENCE: ${{ inputs.audience || 'yotta:release-signing' }}
          # The workflow whose `workflow_ref` the POLICY must pin. A probe runs
          # as itself and therefore cannot observe this value — naming it here
          # keeps the assertion in one visible place instead of buried in a
          # summary string.
          RELEASE_WORKFLOW_FILE: release.yml
          # Never a literal host. This repository is public, and every
          # *.yotta.bot name is treated as a leak unless it is on the
          # allowlist in .github/leak-allowlist.txt - deny by default, which
          # is how this line got written correctly on the second attempt.
          # The estate is named by a repository VARIABLE, set by whoever
          # runs the probe.
          YOTTA_BASE: ${{ inputs.yotta_base || vars.YOTTA_BASE }}
        run: |
          set -euo pipefail

          # The token is a bearer credential for its whole lifetime. Mask it
          # before it can reach a log line, and never echo it.
          TOKEN="$(curl -sSf \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE" | jq -r '.value')"
          echo "::add-mask::$TOKEN"

          # Decode the PAYLOAD only. base64url -> base64, then pad to a multiple
          # of 4; GNU base64 rejects unpadded input.
          payload="$(echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+')"
          case $(( ${#payload} % 4 )) in
            2) payload="${payload}==" ;;
            3) payload="${payload}=" ;;
          esac
          claims="$(echo "$payload" | base64 -d)"

          # Print SELECTED claims, not the whole payload. Everything below is
          # public repository metadata; the payload as a whole is not something
          # to dump into a log on reflex.
          echo "## OIDC claim shape" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          echo "$claims" | jq '{
            iss, aud, sub,
            repository, repository_id, repository_owner, repository_owner_id,
            ref, sha, environment, workflow_ref, job_workflow_ref,
            event_name, run_id, run_attempt, actor, actor_id
          }' | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          # The verifier requires each of these and refuses the token when one
          # is absent - an absent claim would make the policy condition that
          # constrains it vacuously true, which is the one failure mode a
          # trust policy must not have. `job_workflow_ref` is deliberately NOT
          # in this list: GitHub sets it only when a reusable workflow is
          # involved, so requiring it would refuse every direct workflow.
          missing=0
          for c in iss aud sub repository repository_id repository_owner \
                   repository_owner_id ref sha environment workflow_ref \
                   event_name run_id run_attempt; do
            if [ "$(echo "$claims" | jq -r --arg c "$c" '.[$c] // empty')" = "" ]; then
              echo "::error::required claim '$c' is ABSENT - a policy cannot constrain it"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo "::error::the claim set is not what the trust policy expects; do not write a policy from this run"
            exit 1
          fi

          # The values an operator pastes into the policy. Printed together so
          # the two immutable ids cannot be transcribed from different runs.
          {
            echo
            echo "### Values for the YottaBot trust policy"
            echo
            echo '| policy column | value |'
            echo '| --- | --- |'
            for pair in "repository:repository" "repository_id:repository_id" \
                        "repository_owner:repository_owner" \
                        "repository_owner_id:repository_owner_id" \
                        "environment:environment" "external_audience:aud"; do
              col="${pair%%:*}"; claim="${pair##*:}"
              printf '| `%s` | `%s` |\n' "$col" "$(echo "$claims" | jq -r --arg c "$claim" '.[$c]')"
            done
          } >> "$GITHUB_STEP_SUMMARY"

          # The two ref-derived policy columns are NOT emitted as values, on
          # purpose.
          #
          # A probe runs from an `oidc-probe-*` tag; the release runs from a
          # `v*` one. Pasting this run's `ref` into `ref_pattern` would pin the
          # policy to a tag no release will ever carry, and the failure would
          # arrive at the first real release as a refusal nobody could explain
          # from the policy row alone. So the summary prints the SHAPE to write
          # and refuses to hand over a value that would be wrong.
          observed_ref="$(echo "$claims" | jq -r '.ref')"
          observed_wf="$(echo "$claims" | jq -r '.workflow_ref')"
          # <owner>/<repo> — observed, and the only part of workflow_ref a probe
          # can legitimately carry over to the policy.
          repo_prefix="$(echo "$observed_wf" | cut -d/ -f1,2)"
          observed_wf_file="$(echo "$observed_wf" | cut -d@ -f1 | awk -F/ '{print $NF}')"
          {
            echo
            echo "### The two columns you must NOT copy from this run"
            echo
            echo "This run observed \`ref\` = \`$observed_ref\` and"
            echo "\`workflow_ref\` = \`$observed_wf\`."
            echo
            if [ "${observed_ref#refs/tags/v}" = "$observed_ref" ]; then
              echo "That is a **probe** ref, not a release ref. Write the policy with:"
            else
              echo "That is already a release-shaped ref. Write the policy with:"
            fi
            echo
            echo '| policy column | value |'
            echo '| --- | --- |'
            echo '| `ref_pattern` | `refs/tags/v*` |'
            printf '| `workflow_ref_pattern` | `%s/.github/workflows/%s@refs/tags/v*` |\n' \
              "$repo_prefix" "$RELEASE_WORKFLOW_FILE"
            echo
            echo 'The workflow FILE is pinned and only the version varies.'
            if [ "$observed_wf_file" != "$RELEASE_WORKFLOW_FILE" ]; then
              echo
              printf '> This run observed \`%s\`, which is THIS probe. ' "$observed_wf_file"
              printf 'The policy must name \`%s\` — the workflow that signs. ' "$RELEASE_WORKFLOW_FILE"
              echo 'A probe cannot observe another workflow'"'"'s `workflow_ref`,'
              echo '> so that half of the pattern is asserted from the repository'
              echo '> tree rather than measured. Check it against the release'
              echo '> workflow'"'"'s actual filename before enabling the policy.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Present the token to YottaBot and require a refusal
        env:
          AUDIENCE: ${{ inputs.audience || 'yotta:release-signing' }}
          # Never a literal host. This repository is public, and every
          # *.yotta.bot name is treated as a leak unless it is on the
          # allowlist in .github/leak-allowlist.txt - deny by default, which
          # is how this line got written correctly on the second attempt.
          # The estate is named by a repository VARIABLE, set by whoever
          # runs the probe.
          YOTTA_BASE: ${{ inputs.yotta_base || vars.YOTTA_BASE }}
        run: |
          set -euo pipefail

          # No estate configured is not a failure - the claim shape above is
          # useful on its own, and a fork or a contributor running this has no
          # estate to present a token to. Say so and stop.
          if [ -z "${YOTTA_BASE:-}" ]; then
            {
              echo
              echo '### Exchange probe skipped'
              echo
              echo 'No estate URL. Set the `YOTTA_BASE` repository variable, or'
              echo 'pass `yotta_base` when dispatching, to also present the token'
              echo 'and assert that it is refused.'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "no YOTTA_BASE configured; skipping the exchange probe"
            exit 0
          fi

          # A SECOND token, not the one the previous step decoded. Each is
          # single-use by design: YottaBot records an allowed exchange and
          # refuses the same token twice, so reusing one here would test the
          # replay gate rather than the policy.
          TOKEN="$(curl -sSf \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE" | jq -r '.value')"
          echo "::add-mask::$TOKEN"

          # THE ASSERTION IS THAT THIS FAILS.
          #
          # Everything a unit test can check about the verifier has been
          # checked. What no unit test can check is whether a REAL GitHub
          # token, signed by GitHub's real key, verifies against GitHub's real
          # JWKS from inside the estate - and then gets refused by a policy
          # CONDITION rather than by the signature.
          #
          # This probe runs from an `oidc-probe-*` tag and as this workflow, so
          # its `ref` and `workflow_ref` cannot match a policy written for
          # `refs/tags/v*` and release.yml. A refusal is the pass. A TOKEN is a
          # finding: it would mean the policy matches something outside the
          # release path, which is the single highest risk in this design.
          status=$(curl -sS -o /tmp/resp -w '%{http_code}' \
            -X POST "$YOTTA_BASE/api/machine-auth/v1/oauth/federated-token" \
            --data-urlencode 'grant_type=urn:yotta:params:oauth:grant-type:workload-federation' \
            --data-urlencode 'subject_token_type=urn:ietf:params:oauth:token-type:id-token' \
            --data-urlencode "subject_token=$TOKEN")

          # Mask before printing, in case the estate returned one despite the
          # above. The assertion below is what fails the job; the mask is so
          # the failure does not also leak.
          tok="$(jq -r '.access_token // empty' /tmp/resp 2>/dev/null || true)"
          if [ -n "$tok" ]; then echo "::add-mask::$tok"; fi

          {
            echo
            echo "### Exchange probe against \`$YOTTA_BASE\`"
            echo
            echo "HTTP \`$status\`"
            echo
            echo '```json'
            jq '{error, error_description}' /tmp/resp 2>/dev/null || cat /tmp/resp
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$tok" ]; then
            echo "::error::YottaBot ISSUED A TOKEN to a probe tag. The trust policy matches outside the release path - do not enable it."
            exit 1
          fi
          if [ "$status" != "401" ]; then
            echo "::error::expected HTTP 401 from the exchange, got $status"
            cat /tmp/resp
            exit 1
          fi
          echo "refused as expected (HTTP 401, no token issued)"
