name: CI

on:
  push:
    branches: [main]
  pull_request:

# Fork pull requests get a read-only token and no secrets. Release, signing, and
# registry credentials live in a protected environment used only by the release
# workflow, never here.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build, vet, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on:"; echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: build
        run: go build ./...

      - name: test
        run: go test -race -coverprofile=coverage.out ./...

      - name: coverage summary
        run: go tool cover -func=coverage.out | tail -1

  tidy:
    name: go.mod is tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version-file: go.mod
      - run: go mod tidy
      - name: fail if go.mod or go.sum changed
        run: git diff --exit-code -- go.mod go.sum

  leak-scan:
    name: no internal references
    runs-on: ubuntu-latest
    steps:
      # fetch-tags, because stage 3 scans tag annotations and a shallow
      # checkout has none — the scan would pass by seeing nothing.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          fetch-tags: true

      # This repository is public. Its source was extracted from a private
      # monorepo that referenced internal hostnames, source paths, and planning
      # documents, and those references would otherwise have shipped to
      # customers — one of them was in a schema description published to the
      # Terraform Registry, another in an error message practitioners see.
      #
      # If this job fails, fix the file. Do not add an exception without
      # understanding why the pattern was on the list.
      - name: scan for internal references
        env:
          # Read-only, and only for the published release notes. Absent on a
          # fork PR, where the scan says so and skips that stage rather than
          # reporting a pass it did not earn.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          grep -vE '^[[:space:]]*(#|$)' .github/leak-patterns.txt > /tmp/patterns.txt
          grep -vE '^[[:space:]]*(#|$)' .github/leak-allowlist.txt > /tmp/allow.txt
          rc=0

          # Stage 1 — every *.yotta.bot host must be on the allowlist. Deny-by-default,
          # so a new internal hostname fails without anyone adding a pattern for it.
          hosts=$(grep -rhoE '[a-z0-9-]+\.yotta\.bot' --exclude=leak-allowlist.txt --exclude-dir=.git . | sort -u || true)
          for h in $hosts; do
            if ! grep -qxF "$h" /tmp/allow.txt; then
              echo "::error::$h is not on the public host allowlist"
              grep -rnI --exclude-dir=.git -- "$h" . | head -5
              rc=1
            fi
          done

          # Stage 2 — everything else, by pattern.
          #
          # Matched per-MATCH rather than per-line, so an allowlisted string
          # cannot shelter a real leak that happens to share its line. `grep -o`
          # gives file:line:match; the allowlist filters the match column only.
          grep -vE '^[[:space:]]*(#|$)' .github/leak-allow-strings.txt > /tmp/allow-strings.txt
          #
          # `|| true` because finding NOTHING is the success case and grep
          # reports it as exit 1. Under `bash -e` with pipefail that aborted the
          # whole step, silently, on a clean tree - a scan that fails when it
          # has nothing to report is worse than no scan, because the failure
          # invites someone to remove the check.
          { grep -rIonE -f /tmp/patterns.txt \
              --exclude=leak-patterns.txt --exclude=leak-allowlist.txt \
              --exclude=leak-allow-strings.txt --exclude-dir=.git . || true; } \
            | while IFS= read -r hit; do
                m="${hit##*:}"
                grep -qxF "$m" /tmp/allow-strings.txt || printf '%s\n' "$hit"
              done > /tmp/stage2.txt
          if [ -s /tmp/stage2.txt ]; then
            echo "::error::internal references found"
            cat /tmp/stage2.txt
            rc=1
          fi

          # Stage 3 — TAG ANNOTATIONS and RELEASE NOTES.
          #
          # Both are public, neither is a file, and until this existed neither
          # was scanned. An internal planning reference reached this repository
          # through a tag annotation and no check could have caught it; it was
          # found by hand and the tag was deleted. A scan that reads only the
          # working tree is a scan with two open doors next to it.
          git fetch --tags --quiet --force 2>/dev/null || true
          git for-each-ref --format='%(refname:short) %(contents)' refs/tags > /tmp/tags.txt || true
          if [ -s /tmp/tags.txt ] && grep -InE -f /tmp/patterns.txt /tmp/tags.txt > /tmp/tag-hits.txt; then
            echo "::error::internal references in tag annotations — delete or retag; a tag is public"
            cat /tmp/tag-hits.txt
            rc=1
          fi

          if [ -n "${GH_TOKEN:-}" ]; then
            gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
              --jq '.[] | "\(.tag_name) \(.name) \(.body)"' > /tmp/releases.txt 2>/dev/null || true
            if [ -s /tmp/releases.txt ] && grep -InE -f /tmp/patterns.txt /tmp/releases.txt > /tmp/rel-hits.txt; then
              echo "::error::internal references in published release notes — edit the release"
              cat /tmp/rel-hits.txt
              rc=1
            fi
          else
            echo "note: no token, skipping the release-notes scan"
          fi

          [ $rc -eq 0 ] && echo "clean"
          exit $rc

  commit-messages:
    name: no internal references in commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      # Commit messages ship with every clone, and the working-tree scan above
      # structurally cannot see them. That gap is not hypothetical: an earlier
      # pass through this repository left an internal hostname and internal
      # document references in four commit messages while every tree scan
      # reported clean.
      - name: scan commit messages
        run: |
          set -o pipefail
          grep -vE '^[[:space:]]*(#|$)' .github/leak-patterns.txt > /tmp/patterns.txt

          # EVERY commit, not an increment.
          #
          # The increment form (the PR range, or HEAD~1..HEAD on a push) is the
          # right shape for ongoing hygiene and the wrong one for this
          # repository. Going public exposes the WHOLE history at once, and an
          # increment scan has by construction never looked at the commits that
          # were already here when it was added -- so it can report clean over a
          # history it has never read. Scanning all of them costs one grep per
          # commit and removes the distinction entirely.
          #
          # Keep it this way while the history is small enough that "all of it"
          # is cheap. If that stops being true, narrow it by adding a scanned
          # watermark, never by going back to HEAD~1.
          found=0
          for c in $(git rev-list HEAD); do
            if git log -1 --format='%B' "$c" | grep -nIE -f /tmp/patterns.txt; then
              echo "::error::internal reference in commit message $c"
              found=1
            fi
          done
          if [ "$found" = "1" ]; then
            echo "Rewrite the message before merging — it cannot be corrected after a push."
            exit 1
          fi
          echo "clean"

  docs:
    name: generated docs are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_wrapper: false

      # Registry documentation is generated from the schema and from
      # examples/, and it is tied to the release tag — a docs fix needs a new
      # provider version. Stale docs therefore cannot be corrected after the
      # fact, which is why this is a merge gate rather than a release step.
      - name: regenerate
        run: go run github.com/hashicorp/terraform-plugin-docs/cmd/tfplugindocs@v0.25.0 generate --provider-name yottabot

      - name: fail if docs/ changed
        run: |
          if ! git diff --exit-code -- docs/; then
            echo "::error::docs/ is stale — run tfplugindocs generate and commit the result"
            exit 1
          fi

  examples:
    name: examples are valid HCL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_wrapper: false

      # These are not decoration: tfplugindocs inlines them into the Registry
      # documentation, so an example that does not parse ships to customers as
      # the recommended usage.
      - name: terraform fmt
        run: terraform fmt -recursive -check -diff examples/
