name: CI

on:
  push:
    branches: [main]
  pull_request:

# Fork pull requests get a read-only token and no secrets. Release, signing, and
# registry credentials live in a protected environment used only by the release
# workflow, never here.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build, vet, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on:"; echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: build
        run: go build ./...

      - name: test
        run: go test -race -coverprofile=coverage.out ./...

      - name: coverage summary
        run: go tool cover -func=coverage.out | tail -1

  tidy:
    name: go.mod is tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version-file: go.mod
      - run: go mod tidy
      - name: fail if go.mod or go.sum changed
        run: git diff --exit-code -- go.mod go.sum

  leak-scan:
    name: no internal references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # This repository is public. Its source was extracted from a private
      # monorepo that referenced internal hostnames, source paths, and planning
      # documents, and those references would otherwise have shipped to
      # customers — one of them was in a schema description published to the
      # Terraform Registry, another in an error message practitioners see.
      #
      # If this job fails, fix the file. Do not add an exception here without
      # understanding why the pattern was on the list.
      - name: scan for internal references
        run: |
          set -o pipefail
          # The pattern list lives in its own file so this workflow is itself
          # scanned; an inline list would match its own definition.
          if grep -rInE -f .github/leak-patterns.txt \
               --exclude=leak-patterns.txt \
               --include='*.go' --include='*.md' --include='*.yml' \
               --include='*.yaml' --include='go.mod' . ; then
            echo "::error::internal references found — see the lines above"
            exit 1
          fi
          echo "clean"
