name: CI

on:
  push:
    branches: [main]
  pull_request:

# Fork pull requests get a read-only token and no secrets. Release, signing, and
# registry credentials live in a protected environment used only by the release
# workflow, never here.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build, vet, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on:"; echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: build
        run: go build ./...

      - name: test
        run: go test -race -coverprofile=coverage.out ./...

      - name: coverage summary
        run: go tool cover -func=coverage.out | tail -1

  tidy:
    name: go.mod is tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version-file: go.mod
      - run: go mod tidy
      - name: fail if go.mod or go.sum changed
        run: git diff --exit-code -- go.mod go.sum

  leak-scan:
    name: no internal references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # This repository is public. Its source was extracted from a private
      # monorepo that referenced internal hostnames, source paths, and planning
      # documents, and those references would otherwise have shipped to
      # customers — one of them was in a schema description published to the
      # Terraform Registry, another in an error message practitioners see.
      #
      # If this job fails, fix the file. Do not add an exception without
      # understanding why the pattern was on the list.
      - name: scan for internal references
        run: |
          set -o pipefail
          grep -vE '^[[:space:]]*(#|$)' .github/leak-patterns.txt > /tmp/patterns.txt
          grep -vE '^[[:space:]]*(#|$)' .github/leak-allowlist.txt > /tmp/allow.txt
          rc=0

          # Stage 1 — every *.yotta.bot host must be on the allowlist. Deny-by-default,
          # so a new internal hostname fails without anyone adding a pattern for it.
          hosts=$(grep -rhoE '[a-z0-9-]+\.yotta\.bot' --exclude=leak-allowlist.txt --exclude-dir=.git . | sort -u || true)
          for h in $hosts; do
            if ! grep -qxF "$h" /tmp/allow.txt; then
              echo "::error::$h is not on the public host allowlist"
              grep -rnI --exclude-dir=.git -- "$h" . | head -5
              rc=1
            fi
          done

          # Stage 2 — everything else, by pattern.
          if grep -rInE -f /tmp/patterns.txt --exclude=leak-patterns.txt --exclude=leak-allowlist.txt --exclude-dir=.git .; then
            echo "::error::internal references found"
            rc=1
          fi
          [ $rc -eq 0 ] && echo "clean"
          exit $rc

  commit-messages:
    name: no internal references in commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      # Commit messages ship with every clone, and the working-tree scan above
      # structurally cannot see them. That gap is not hypothetical: an earlier
      # pass through this repository left an internal hostname and internal
      # document references in four commit messages while every tree scan
      # reported clean.
      - name: scan commit messages
        run: |
          set -o pipefail
          grep -vE '^[[:space:]]*(#|$)' .github/leak-patterns.txt > /tmp/patterns.txt
          range="${{ github.event.pull_request.base.sha }}..HEAD"
          if [ -z "${{ github.event.pull_request.base.sha }}" ]; then
            range="HEAD~1..HEAD"
          fi
          found=0
          for c in $(git rev-list "$range"); do
            if git log -1 --format='%B' "$c" | grep -nIE -f /tmp/patterns.txt; then
              echo "::error::internal reference in commit message $c"
              found=1
            fi
          done
          if [ "$found" = "1" ]; then
            echo "Rewrite the message before merging — it cannot be corrected after a push."
            exit 1
          fi
          echo "clean"

  docs:
    name: generated docs are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_wrapper: false

      # Registry documentation is generated from the schema and from
      # examples/, and it is tied to the release tag — a docs fix needs a new
      # provider version. Stale docs therefore cannot be corrected after the
      # fact, which is why this is a merge gate rather than a release step.
      - name: regenerate
        run: go run github.com/hashicorp/terraform-plugin-docs/cmd/tfplugindocs@v0.25.0 generate --provider-name yottabot

      - name: fail if docs/ changed
        run: |
          if ! git diff --exit-code -- docs/; then
            echo "::error::docs/ is stale — run tfplugindocs generate and commit the result"
            exit 1
          fi

  examples:
    name: examples are valid HCL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_wrapper: false

      # These are not decoration: tfplugindocs inlines them into the Registry
      # documentation, so an example that does not parse ships to customers as
      # the recommended usage.
      - name: terraform fmt
        run: terraform fmt -recursive -check -diff examples/
