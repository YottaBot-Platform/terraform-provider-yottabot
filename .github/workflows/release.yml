name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # create the GitHub release
  id-token: write   # artifact attestation
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest

    # Releases run only from a protected environment, so publishing requires a
    # maintainer approval step that a tag push alone cannot bypass. Fork
    # workflows never reach this job and never see these secrets.
    environment: release

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version-file: go.mod
          cache: true

      # A release must not be cut from a tree that fails its own gates. The tag
      # is immutable once published, so this is the last point where a bad
      # release is still preventable.
      - name: preflight — tests
        run: go test -race ./...

      - name: preflight — docs are current
        run: |
          go run github.com/hashicorp/terraform-plugin-docs/cmd/tfplugindocs@v0.25.0 generate --provider-name yottabot
          if ! git diff --exit-code -- docs/; then
            echo "::error::docs/ is stale at the release tag — Registry docs are tied to this tag and cannot be fixed after publication"
            exit 1
          fi

      - name: preflight — changelog names this version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! grep -q "^## ${version//./\\.} " CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no entry for ${version}"
            exit 1
          fi

      - name: preflight — working tree is clean
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::working tree is dirty at the release tag"
            git status --porcelain
            exit 1
          fi

      # GoReleaser's `sboms` block shells out to syft, which is not on the
      # runner. Without this the release fails AFTER building and archiving
      # every artifact and BEFORE producing the checksums - so the failure is
      # late, expensive, and lands on a tag that is already pushed.
      #
      # Found by the dry run: no release had ever been cut, so nothing had
      # exercised this path. Pinned by commit like every other action here.
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      # Obtain a signing credential without holding one.
      #
      # This replaced an imported GPG private key and passphrase. Both lived in
      # repository secrets, which means anything able to run a step here could
      # read them, and a release-signing key is worth stealing. Nothing secret
      # is referenced below: the job presents the OpenID Connect token GitHub
      # mints for it, and receives a token that expires in minutes and can sign
      # exactly one key record.
      #
      # The protected `release` environment above is load-bearing for this, not
      # decoration. The signing service's trust policy REQUIRES the environment
      # claim, which GitHub only sets for a job that names one - so the reviewer
      # on that environment is inside the trust boundary, and a workflow that
      # skipped it could not obtain a credential at all.
      # No exchange step here on purpose. The credential is minted inside
      # scripts/sign-release.sh, at the moment it signs.
      #
      # A run proved why: the token lives five minutes, GoReleaser spent nearly
      # nine building and archiving before it reached signing, and the token was
      # four minutes dead on arrival. Minting where the credential is USED is
      # the point of a short-lived credential; minting early and carrying it
      # turns a short life from a security property into a race.

      # The certificate a practitioner imports to verify this release. Public by
      # definition, and the anchor the signer checks its own output against - if
      # it disagrees with the key the exchange granted, the signer refuses
      # rather than producing a signature nobody can verify.
      - name: materialise the published signing certificate
        run: |
          set -euo pipefail
          printf '%s\n' "${SIGNING_CERT}" > "${RUNNER_TEMP}/signing-cert.asc"
          if ! grep -q 'BEGIN PGP PUBLIC KEY BLOCK' "${RUNNER_TEMP}/signing-cert.asc"; then
            echo "::error::YOTTA_SIGNING_CERT_ASC is not an armored public key."
            exit 1
          fi
        env:
          SIGNING_CERT: ${{ vars.YOTTA_SIGNING_CERT_ASC }}

      - uses: goreleaser/goreleaser-action@9c156ee8a17a598857849441385a2041ef570552 # v6.3.0
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Consumed by scripts/sign-release.sh. The key and fingerprint come from
          # the EXCHANGE, never from a constant in this repository: an
          # expected-fingerprint that can be edited in the same pull request as
          # the code being signed is not a check.
          YOTTA_BASE: ${{ vars.YOTTA_BASE }}
          YOTTA_AUDIENCE: ${{ vars.YOTTA_AUDIENCE || 'yotta:release-signing' }}
          YOTTA_SIGNING_CERT: ${{ runner.temp }}/signing-cert.asc

      # The property the Registry actually enforces, asserted here.
      #
      # It reads SHA256SUMS as the manifest of the release and refuses the whole
      # version if it names a file the Registry does not ingest. That is how
      # v0.1.0-rc.1 died: thirteen SBOM entries, "missing files in request body".
      # The release is already published by this point, so this cannot prevent
      # the tag -- but it fails loudly here rather than leaving someone to read
      # it out of a resync dialog days later.
      - name: assert the checksums file is Registry-shaped
        run: |
          set -euo pipefail
          sums="$(ls dist/*SHA256SUMS)"
          if grep -q 'sbom.json' "$sums"; then
            echo "::error::SHA256SUMS names SBOM files; the Registry will refuse this version"
            grep 'sbom.json' "$sums"
            exit 1
          fi
          echo "checksums list $(wc -l < "$sums") files, none of them SBOMs"

      # SBOMs, built AFTER GoReleaser and uploaded straight to the release.
      #
      # Deliberately outside GoReleaser's artifact set: anything in that set is
      # written into SHA256SUMS, and the check above is what that costs. Built
      # here instead, they are still published for anyone who wants them and
      # cannot reach the checksums file.
      - name: generate and upload SBOMs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          made=0
          for z in dist/*.zip; do
            [ -e "$z" ] || continue
            syft scan "file:$z" -o "cyclonedx-json=${z}.sbom.json" -q
            made=$((made+1))
          done
          if [ "$made" -eq 0 ]; then
            echo "::error::no archives found to scan — SBOMs would be silently absent"
            exit 1
          fi
          gh release upload "${GITHUB_REF_NAME}" dist/*.sbom.json --clobber
          echo "uploaded $made SBOM(s)"

      - name: attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/*.zip'
